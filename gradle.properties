# Requires a JDK 17+ toolchain (the native bridge needs javac + jni.h).
# Gradle uses JAVA_HOME / the `java` on PATH. To pin a specific JDK when you have
# several installed, uncomment and set:
#   org.gradle.java.home=/path/to/jdk17
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
