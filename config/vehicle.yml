# Virtual Vehicle/powertrain ECU. Mostly telemetry the ECU emits (speed, RPM,
# coolant, gear, fuel), plus one command in (drive mode). For telemetry signals
# the control both sets and shows them, so request == feedback == the signal.

ecu:
  name: Vehicle

# CAN interface + bitrate are chosen in the app toolbar (shared by all ECUs).

defaults:
  VehicleSpeed: 0.0
  EngineRPM: 800.0
  CoolantTemp: 90.0
  GearPosition: 0.0
  FuelLevel: 75.0
  DriveModeReq: 0.0
  DriveModeState: 0.0
  SteeringWheelAngle: 0.0
  SteeringCounter: 0.0

ui:
  - { id: speed,   title: Vehicle Speed, widget: slider, min: 0, max: 240,  step: 1,  request: VehicleSpeed, feedback: VehicleSpeed }
  - { id: rpm,     title: Engine RPM,    widget: slider, min: 0, max: 8000, step: 50, request: EngineRPM,    feedback: EngineRPM }
  - { id: coolant, title: Coolant Temp,  widget: slider, min: -20, max: 130, step: 1, request: CoolantTemp,  feedback: CoolantTemp }
  - { id: gear,    title: Gear,          widget: dropdown, request: GearPosition, feedback: GearPosition }
  - { id: fuel,    title: Fuel Level,    widget: slider, min: 0, max: 100,  step: 1,  request: FuelLevel,    feedback: FuelLevel }
  - { id: mode,    title: Drive Mode,    widget: dropdown, request: DriveModeReq, feedback: DriveModeState }
  - { id: speedGauge, title: Speed,  widget: gauge, min: 0, max: 240,  feedback: VehicleSpeed }
  - { id: rpmGauge,   title: RPM,    widget: gauge, min: 0, max: 8000, feedback: EngineRPM }
  - { id: steering,        title: Steering Angle, widget: slider, min: -720, max: 720, step: 1, request: SteeringWheelAngle, feedback: SteeringWheelAngle, snap_zero: true }
  - { id: steeringGauge,   title: Steering Angle, widget: gauge,  min: -720, max: 720, feedback: SteeringWheelAngle }
  - { id: steeringCounter, title: Steering Counter (alive), widget: gauge, min: 0, max: 15, feedback: SteeringCounter }

rules:
  # IVI drive-mode command -> reported drive-mode state.
  - { type: mirror, from: DriveModeReq, to: DriveModeState }
  # Rolling alive counter for SteeringStatus; receivers detect loss via (rx != (prev+1) mod 16).
  - { type: counter, to: SteeringCounter, wrap: 16 }

tx:

  - { message: VehicleStatus,      period_ms: 1000, on_change: true }
  - { message: EngineStatus,       period_ms: 1000, on_change: true }
  - { message: TransmissionStatus, on_change: true }   # gear = event-triggered
  - { message: BodyStatus,         period_ms: 1000, on_change: true}
  - { message: SteeringStatus,     period_ms: 1000, on_change: true }    # dead-reckoning input; as fast as the sim tick allows
